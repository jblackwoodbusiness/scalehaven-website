<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | ScaleHaven</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/brand_assets/scalehaven_favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Work+Sans:wght@400;500;600&display=swap" />
  <style>
    :root { --navy:#1a2745; --navy-dark:#0d1720; --gold:#c09540; --cream:#f5f0e8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:2rem; background:radial-gradient(ellipse at 20% 10%, rgba(192,149,64,0.14), transparent 55%), linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%); color:#fff; font-family:'Work Sans', system-ui, sans-serif; text-align:center; }
    .code { font-family:'Cormorant Garamond', Georgia, serif; font-size:clamp(5rem, 14vw, 9rem); font-weight:600; line-height:1; color:var(--gold); letter-spacing:-0.04em; }
    h1 { font-family:'Cormorant Garamond', Georgia, serif; font-size:clamp(1.75rem, 4vw, 2.5rem); font-weight:600; letter-spacing:-0.02em; margin:1rem 0 0.75rem; }
    p { max-width:34rem; margin:0 auto 2rem; color:rgba(255,255,255,0.7); line-height:1.7; font-size:1rem; }
    .actions { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; padding:0.9rem 1.6rem; border-radius:6px; font-size:0.8125rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; text-decoration:none; transition:transform 0.2s cubic-bezier(0.16,1,0.3,1), opacity 0.2s ease; }
    a.btn:hover { transform:translateY(-2px); }
    a.btn:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
    a.btn:active { transform:translateY(0); }
    .primary { background:var(--gold); color:var(--navy-dark); }
    .ghost { border:1px solid rgba(255,255,255,0.35); color:#fff; }
    .ghost:hover { opacity:0.85; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>That page isn't here.</h1>
    <p>The link may be old, or the page moved. The parts that matter are one click away.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to the homepage</a>
      <a class="btn ghost" href="/blog/">Read the blog</a>
      <a class="btn ghost" href="https://calendly.com/john-scalehaven/30min">Book a free call</a>
    </div>
  </main>
</body>
</html>
